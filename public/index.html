<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CivicLens</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='14' r='9' fill='none' stroke='%232b59c3' stroke-width='4'/><path d='M21 21l7 7' stroke='%232b59c3' stroke-width='4' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="4"/><path d="M21 21l7 7" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <div>
        <strong>CivicLens</strong>
        <span>AI triage for citizen complaints</span>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="report" class="active">Report an issue</button>
      <button role="tab" data-view="dashboard">Officer dashboard</button>
    </nav>
    <div id="engine" class="engine" title="Triage engine in use">…</div>
  </header>

  <!-- CITIZEN VIEW -->
  <main id="view-report" class="view">
    <section class="card compose">
      <h1>What's the problem?</h1>
      <p class="muted">Describe it in English, ಕನ್ನಡ, हिन्दी or any language. Add a photo if you can.</p>
      <form id="form">
        <div class="textarea-wrap">
          <textarea id="text" rows="5" placeholder="e.g. Big pothole near Hebbal flyover, two bikes fell yesterday…"></textarea>
          <button type="button" id="mic" class="mic" title="Speak your complaint" hidden>
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
        </div>
        <div class="row">
          <label class="photo-btn">
            <input type="file" id="photo" accept="image/*" hidden />
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
            <span id="photo-label">Add photo</span>
          </label>
          <select id="speech-lang" title="Voice input language" hidden>
            <option value="en-IN">English</option>
            <option value="kn-IN">ಕನ್ನಡ</option>
            <option value="hi-IN">हिन्दी</option>
            <option value="ta-IN">தமிழ்</option>
            <option value="te-IN">తెలుగు</option>
          </select>
          <span class="spacer"></span>
          <button type="submit" id="submit" class="primary">Submit complaint</button>
        </div>
        <div id="photo-preview" class="photo-preview" hidden>
          <img alt="Attached photo" /><button type="button" id="photo-remove" aria-label="Remove photo">×</button>
        </div>
      </form>
      <div class="samples">
        <span class="muted small">Try a sample:</span>
        <div id="samples"></div>
      </div>
    </section>

    <section id="result" class="card result" hidden></section>
  </main>

  <!-- OFFICER VIEW -->
  <main id="view-dashboard" class="view" hidden>
    <section class="kpis" id="kpis"></section>

    <section class="card">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search tickets, places…" />
        <select id="f-dept"><option value="">All departments</option></select>
        <select id="f-cat"><option value="">All categories</option></select>
        <select id="f-status">
          <option value="active">Active (not resolved)</option>
          <option value="">All statuses</option>
        </select>
        <span class="spacer"></span>
        <button id="seed" class="ghost">Load demo data</button>
        <button id="reset" class="ghost danger">Clear</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Priority</th><th>Issue</th><th>Department</th><th>Reports</th><th>SLA</th><th>Status</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No tickets yet. Submit a complaint or load the demo data.</p>
      </div>
    </section>

    <section class="card">
      <h2>Load by department</h2>
      <div id="load"></div>
    </section>
  </main>

  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-panel" role="dialog" aria-modal="true">
      <button class="close" id="drawer-close" aria-label="Close">×</button>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <script src="/app.js" type="module"></script>
</body>
</html>
